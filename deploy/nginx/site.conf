# nginx inside the container: serves the Unity WebGL build (Brotli-compressed files, decompression fallback on).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The build files keep the same URL from one version to the next, so the browser must revalidate
    # them every time (ETag, cheap 304): a long cache once mixed an old data file with new code and
    # crashed the engine at start-up. Unity's own IndexedDB cache still avoids re-downloading.
    etag on;
    add_header Cache-Control "no-cache";
    # Only the studio website may show the game in a frame (gorasgames.fr/cv); localhost:4330 and
    # :8091 are the site's local development and control servers. Repeated in every location:
    # an add_header inside a location drops the ones of the server block.
    add_header Content-Security-Policy "frame-ancestors 'self' https://gorasgames.fr http://localhost:4330 http://localhost:8091" always;

    # Unity names its Brotli-compressed files *.unityweb: announce the encoding so the browser decompresses natively.
    location ~ \.data\.unityweb$ {
        add_header Content-Encoding br;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-ancestors 'self' https://gorasgames.fr http://localhost:4330 http://localhost:8091" always;
        default_type application/octet-stream;
    }
    location ~ \.wasm\.unityweb$ {
        add_header Content-Encoding br;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-ancestors 'self' https://gorasgames.fr http://localhost:4330 http://localhost:8091" always;
        default_type application/wasm;
    }
    location ~ \.js\.unityweb$ {
        add_header Content-Encoding br;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-ancestors 'self' https://gorasgames.fr http://localhost:4330 http://localhost:8091" always;
        default_type application/javascript;
    }
}
