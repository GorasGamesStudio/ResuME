# nginx inside the container: serves the Unity WebGL build (Brotli-compressed files, decompression fallback on).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long cache for the versioned build files, none for the page itself.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /Build/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    # Unity names its Brotli-compressed files *.unityweb: announce the encoding so the browser decompresses natively.
    location ~ \.data\.unityweb$ {
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/octet-stream;
    }
    location ~ \.wasm\.unityweb$ {
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/wasm;
    }
    location ~ \.js\.unityweb$ {
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/javascript;
    }
}
