# Host nginx site for ResuME: /etc/nginx/sites-available/resume.conf, linked into sites-enabled.
# Both names serve the same build; the game reads the host name to pick the default language
# (cv.gorasgames.fr: French, resume.gorasgames.fr: English). TLS by certbot:
#   sudo certbot --nginx -d cv.gorasgames.fr -d resume.gorasgames.fr
# Prototype password (remove the two auth_basic lines to open the site); htpasswd comes with
# apache2-utils, or without it: printf 'graphiste:%s\n' "$(openssl passwd -apr1)" | sudo tee /etc/nginx/.htpasswd-resume
#   sudo htpasswd -c /etc/nginx/.htpasswd-resume graphiste
server {
    listen 80;
    listen [::]:80;
    server_name cv.gorasgames.fr resume.gorasgames.fr;

    location / {
        auth_basic           "ResuME, prototype";
        auth_basic_user_file /etc/nginx/.htpasswd-resume;

        proxy_pass         http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Pass the Content-Encoding of the build files through untouched.
        proxy_set_header   Accept-Encoding "";
    }
}
